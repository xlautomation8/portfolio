name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start local web server
        run: python3 -m http.server 8080 &

      - name: Wait for server to be ready
        run: curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080 > /dev/null

      - name: Run tests
        run: npm test
        env:
          SITE_TARGET: local

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/output/
          retention-days: 14
